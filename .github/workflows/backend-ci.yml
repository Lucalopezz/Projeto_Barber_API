name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Architecture, lint, build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: docker
          POSTGRES_DB: barber_api
        ports:
          - 5450:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d barber_api"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare isolated CI environment
        run: |
          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs');
          const { randomBytes } = require('node:crypto');
          const { parseEnv } = require('node:util');
          for (const [source, target] of [['.env.example', '.env.development'], ['.env.test.example', '.env.test']]) {
            const content = readFileSync(source, 'utf8').replace(/^JWT_SECRET=.*$/m, `JWT_SECRET=${randomBytes(32).toString('hex')}`);
            writeFileSync(target, content, { flag: 'wx', mode: 0o600 });
          }
          const environment = parseEnv(readFileSync('.env.test', 'utf8'));
          const database = new URL(environment.DATABASE_URL);
          if (environment.NODE_ENV !== 'test' || database.hostname !== 'localhost' || database.port !== '5450' || database.pathname !== '/barber_api' || database.searchParams.get('schema') !== 'barber_api_test') {
            throw new Error('CI requires the local PostgreSQL service and isolated barber_api_test schema.');
          }
          NODE
      - name: Generate Prisma client
        run: pnpm prisma:generate
      - name: Test architecture rules
        run: pnpm test:architecture
      - name: Check source architecture
        run: pnpm check:architecture
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build
      - name: Unit tests
        run: pnpm test
      - name: Fixed assistant evaluations
        run: pnpm test:evals
      - name: Apply test migrations
        run: pnpm prisma:migrate:test
      # These suites clear the same schema and must stay sequential.
      - name: Integration tests
        run: pnpm test:int
      - name: HTTP end-to-end tests
        run: pnpm test:e2e
