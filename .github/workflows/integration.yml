name: Integrated CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      peer_sha:
        description: SHA completo de 40 caracteres do frontend; vazio seleciona main
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  integration:
    name: Frontend and API
    # Workflow compartilhado fixado no commit publicado do frontend; atualizar explicitamente após revisão.
    uses: Lucalopezz/Frontend_Barber_API/.github/workflows/integration.yml@d03eda249b023e5d52abeb2d8448d601bb142a7c
    with:
      peer_sha: ${{ inputs.peer_sha || '' }}
