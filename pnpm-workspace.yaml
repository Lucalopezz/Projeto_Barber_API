allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  # Swagger telemetry is unnecessary for local development/builds.
  '@scarf/scarf': false
  '@parcel/watcher': true
  'unrs-resolver': true
overrides:
  # Nest pins an older Fastify 5 release; preserve its major with security fixes.
  '@nestjs/platform-fastify>fastify': '5.12.7'
  # Prisma 6 generate/migrate retain the deepmerge API used by its config.
  '@prisma/config>deepmerge-ts': '8.0.2'
  # Stay on Swagger's YAML major, with alias-expansion fixes.
  '@nestjs/swagger>js-yaml': '5.5.0'
  # The NYC loader uses load(), supported by YAML 4; removes vulnerable sprintf-js.
  '@istanbuljs/load-nyc-config>js-yaml': '4.3.2'
