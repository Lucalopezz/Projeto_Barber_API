name: barber-ai-lab
services:
  db:
    image: postgres:15
    container_name: api-barber-db
    restart: "no"
    ports:
      - '127.0.0.1:5450:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: barber_api
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d barber_api"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
