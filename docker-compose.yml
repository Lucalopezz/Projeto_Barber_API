name: barber-ai-lab
services:
  redis:
    image: redis:7.4-alpine
    restart: "no"
    ports:
      - '127.0.0.1:6380:6379'
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  db:
    image: postgres:15
    container_name: api-barber-db
    restart: "no"
    ports:
      - '127.0.0.1:5450:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: barber_api
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d barber_api"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis_data:
  postgres_data:
